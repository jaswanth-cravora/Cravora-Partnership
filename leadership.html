<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravora | Leadership</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .leadership-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .leader-card {
            background: white;
            padding: 35px 20px;
            border-radius: 14px;
            text-align: center;
            border-top: 5px solid #087F5B;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .leader-role {
            color: #087F5B;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .leader-name {
            color: #171717;
            font-size: 22px;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <h1><span style="color:#087F5B">CRAV</span><span style="color:#171717">ORA</span></h1>
        <p>Every Craving, Delivered</p>
    </div>

    <nav>
        <a href="./index.html">Dashboard</a>
        <a href="./index.html#orders">Orders</a>
        <a href="./menu.html">My Menu</a>
        <a href="./index.html#earnings">Earnings</a>
        <a href="./index.html#reviews">Reviews</a>
        <a href="./register.html">Restaurant Registration</a>
        <a href="./accounts.html">Accounts</a>
        <a href="./index.html#settings">Settings</a>
        <a href="./leadership.html">Leadership</a>
    </nav>
</aside>

<main class="main-content">
    <header>
        <h2>Leadership</h2>
        <p>The leadership team behind Cravora.</p>
    </header>

    <section class="leadership-grid">
        <div class="leader-card">
            <p class="leader-role">FOUNDER</p>
            <h2 class="leader-name">T. JASWANTH REDDY</h2>
        </div>

        <div class="leader-card">
            <p class="leader-role">CO-FOUNDER</p>
            <h2 class="leader-name">G. DHANUSH</h2>
        </div>
    </section>
</main>

</body>
</html>
